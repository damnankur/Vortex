# Credential-free local development stack for Vortex.
#
#   docker compose up --build
#
# Brings up Postgres, Redis, Kafka (KRaft, single node) and the API server at
# http://localhost:5000 (health: GET /healthz, metrics: GET /metrics).
#
# SECURITY: everything below is PLAINTEXT and uses throwaway credentials.
# Production requires TLS (Kafka KAFKA_CA_CERT, Redis rediss) plus real secrets:
# the server env schema (apps/server/src/env.ts) rejects NODE_ENV=production
# unless REDIS_PASSWORD, KAFKA_USER/KAFKA_PASSWORD and KAFKA_CA_CERT are set.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
      POSTGRES_DB: vortex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex -d vortex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No password locally: REDIS_PASSWORD is empty and the env schema only
    # requires one when NODE_ENV=production.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft (broker + controller in one process), PLAINTEXT only.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://vortex:vortex@postgres:5432/vortex
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: default
      REDIS_PASSWORD: ""
      KAFKA_BROKER: kafka:9092
      KAFKA_USER: ""
      KAFKA_PASSWORD: ""
      # Local-only signing key (must be >= 32 chars); never reuse outside dev.
      JWT_SECRET: vortex-local-dev-jwt-secret-not-for-production-use
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "5000:5000"

volumes:
  postgres-data:
